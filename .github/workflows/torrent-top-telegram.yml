name: Telegram Torrent Top 25

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/torrent-top-telegram.yml"
      - "telegram-top-agent/**"
  schedule:
    # 18:00 Asia/Yekaterinburg (UTC+5) = 13:00 UTC.
    # GitHub scheduled runs may start a few minutes later under load.
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-torrent-top-25
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-top-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-top-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Runtime compatibility and quality patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.py')
          s = p.read_text(encoding='utf-8')

          # Tapochek: use its tracker search sorted by total downloads (o=4)
          # instead of the ordinary forum view. The site's certificate chain is
          # not trusted by GitHub-hosted runners, so TLS verification is disabled
          # only for these public read-only requests; no credentials are sent.
          old = '''url = f"https://tapochek.net/viewforum.php?f={forum_id}"
              r = s.get(url, timeout=REQUEST_TIMEOUT, allow_redirects=True)
              if r.status_code != 200:'''
          new = '''url = f"https://tapochek.net/tracker.php?f={forum_id}&o=4&s=2&tm=-1&sns=-1"
              r = s.get(url, timeout=REQUEST_TIMEOUT, allow_redirects=True, verify=False)
              if r.status_code != 200:'''
          s = s.replace(old, new)

          # Wikipedia: strip disambiguation suffixes from page titles before
          # matching and require an almost exact title/alias match.
          s = s.replace(
              'page_title = canonical_title(str(page.get("title", "")))',
              'page_title = canonical_title(re.sub(r"\\s*\\([^)]*\\)\\s*$", "", str(page.get("title", ""))))'
          )
          s = s.replace('if best_score < 0.52:', 'if best_score < 0.98:')

          # Reject obvious disambiguation/list pages and wrong-year film pages.
          old_return = '''if best_score < 0.98:
              return ""
          return shorten_description(best_extract)'''
          new_return = '''if best_score < 0.98:
              return ""
          low_best = best_extract.lower()
          if any(x in low_best for x in ("название фильмов", "список и описание эпизодов", "список эпизодов")):
              return ""
          if item.kind == "movie" and item.year:
              years = [int(y) for y in ANY_YEAR_RE.findall(best_extract)]
              if years and all(abs(y - item.year) > 1 for y in years):
                  return ""
          return shorten_description(best_extract)'''
          s = s.replace(old_return, new_return)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build and send report
        env:
          TOP_N: "25"
          TZ_NAME: Asia/Yekaterinburg
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py
