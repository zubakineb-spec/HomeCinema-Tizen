name: Telegram Torrent Top 25

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/torrent-top-telegram.yml"
      - "telegram-top-agent/**"
  schedule:
    # 18:00 Asia/Yekaterinburg (UTC+5) = 13:00 UTC.
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-torrent-top-25
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-top-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-top-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Runtime compatibility and quality patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.py')
          s = p.read_text(encoding='utf-8')

          injected = r'''
          def parse_rutrackerr_public() -> list[Item]:
              page, _ = fetch_first(["https://rutrackerr.ru/"])
              soup = BeautifulSoup(page, "html.parser")

              def section(start_re: str, stop_re: str, kind: str) -> list[Item]:
                  marker = soup.find(string=re.compile(start_re, re.I))
                  if not marker:
                      return []
                  items: list[Item] = []
                  seen: set[str] = set()
                  for node in marker.parent.next_elements:
                      if isinstance(node, NavigableString):
                          txt = clean_title(str(node))
                          if items and re.search(stop_re, txt, re.I):
                              break
                          continue
                      if not isinstance(node, Tag) or node.name != "a":
                          continue
                      raw_title = clean_title(node.get_text(" ", strip=True))
                      if not PAREN_YEAR_RE.search(raw_title):
                          continue
                      href = str(node.get("href", ""))
                      if not href:
                          continue

                      year = extract_year(raw_title)
                      ru_title = re.sub(r"\s*\((?:19|20)\d{2}\)\s*$", "", raw_title).strip()

                      # Read the metadata text belonging to this one card. The
                      # homepage publicly exposes the original title, which is
                      # valuable for matching the same work across sources.
                      meta_parts: list[str] = []
                      for nxt in node.next_elements:
                          if nxt is node:
                              continue
                          if isinstance(nxt, Tag) and nxt.name == "a":
                              candidate = clean_title(nxt.get_text(" ", strip=True))
                              if candidate and PAREN_YEAR_RE.search(candidate):
                                  break
                          if isinstance(nxt, NavigableString):
                              part = str(nxt)
                              meta_parts.append(part)
                              if "Дата добавления" in part:
                                  break
                      meta = clean_title(" ".join(meta_parts))
                      original = ""
                      m = re.search(
                          r"Оригинальное\s+название:\s*(.*?)\s*(?=Страна:|Режиссер:|Режиссёр:|Жанр:|Актеры:|Актёры:|Дата\s+добавления:)",
                          meta,
                          re.I,
                      )
                      if m:
                          original = clean_title(m.group(1))
                      title = raw_title
                      if original and canonical_title(original) != canonical_title(ru_title):
                          title = f"{ru_title} / {original} ({year})" if year else f"{ru_title} / {original}"

                      key = canonical_title(title)
                      if not key or key in seen:
                          continue
                      seen.add(key)
                      rank = len(items) + 1
                      items.append(Item(
                          title=title,
                          year=year,
                          kind=kind,
                          source="Rutrackerr.ru",
                          metric_name="место в публичном рейтинге",
                          metric_value=max(1, 101 - rank),
                          metric_display=f"№{rank} в рейтинге «сейчас скачивают»",
                      ))
                      if rank >= 25:
                          break
                  return items

              movies = section(
                  r"ТОП\s+торрентов\s*-?\s*сейчас\s+скачивают",
                  r"Обновления\s+на\s+сайте|Лучшие\s+сериалы",
                  "movie",
              )
              series = section(
                  r"Лучшие\s+сериалы\s*-?\s*скачивают\s+сейчас",
                  r"ЖАНРЫ\s+ФИЛЬМОВ|Фильмы\s+через\s+торрент",
                  "series",
              )
              print(f"Rutrackerr.ru: movies={len(movies)}, series={len(series)}", file=sys.stderr)
              result = movies + series
              if not result:
                  raise RuntimeError("public ranking blocks not parsed")
              return dedupe_source(result)
          '''
          s = s.replace('\ndef parse_kinozal()', injected + '\n\ndef parse_kinozal()', 1)
          s = s.replace('        ("Tapochek", parse_tapochek),', '        ("Rutrackerr.ru", parse_rutrackerr_public),')

          # Match bilingual tracker titles by aliases. Thus "Укрытие / Silo" and
          # "Укрытие / Бункер / Silo" are one series, as are Russian-only vs
          # bilingual variants when their English original title is known.
          start = s.index('\ndef same_work(')
          end = s.index('\ndef metric_note(', start)
          same_work_impl = r'''
          def work_aliases(title: str) -> list[str]:
              parts = re.split(r"\s*/\s*|\s*\|\s*", base_title(title))
              aliases: list[str] = []
              for part in parts:
                  c = canonical_title(part)
                  if c and c not in aliases:
                      aliases.append(c)
              full = canonical_title(title)
              if full and full not in aliases:
                  aliases.append(full)
              return aliases


          def same_work(a: Item, b: Item) -> bool:
              if a.kind != b.kind:
                  return False
              if a.kind == "movie" and a.year and b.year and abs(a.year - b.year) > 1:
                  return False
              aa, bb = work_aliases(a.title), work_aliases(b.title)
              if not aa or not bb:
                  return False
              if set(aa) & set(bb):
                  return True
              threshold = 0.90 if a.kind == "series" else 0.92
              return max(SequenceMatcher(None, x, y).ratio() for x in aa for y in bb) >= threshold
          '''
          s = s[:start] + same_work_impl + s[end:]

          # Wikipedia enrichment: with bilingual titles query by the last alias
          # (normally the original/English title), then reject ambiguous/list or
          # non-film results rather than risk attaching a wrong synopsis.
          s = s.replace(
              'primary = variants[0]',
              'primary = variants[-1] if len(variants) > 1 else variants[0]'
          )
          s = s.replace(
              'page_title = canonical_title(str(page.get("title", "")))',
              'page_title = canonical_title(re.sub(r"\\s*\\([^)]*\\)\\s*$", "", str(page.get("title", ""))))'
          )
          s = s.replace('if best_score < 0.52:', 'if best_score < 0.98:')

          old_return = '''if best_score < 0.98:
              return ""
          return shorten_description(best_extract)'''
          new_return = '''if best_score < 0.98:
              return ""
          low_best = best_extract.lower()
          bad_markers = (
              "название фильмов", "может означать", "может иметь следующие значения",
              "список и описание эпизодов", "список эпизодов",
              "саундтрек-альбом", "саундтрек альбом", "soundtrack album",
          )
          if any(x in low_best for x in bad_markers):
              return ""
          if item.kind == "movie" and item.year:
              years = [int(y) for y in ANY_YEAR_RE.findall(best_extract)]
              if years and all(abs(y - item.year) > 1 for y in years):
                  return ""
          return shorten_description(best_extract)'''
          s = s.replace(old_return, new_return)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build and send report
        env:
          TOP_N: "25"
          TZ_NAME: Asia/Yekaterinburg
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py
