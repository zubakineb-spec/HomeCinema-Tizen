name: QNAP diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qnap-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: native-qnap-d1/go.mod

      - name: Capture exact gofmt diff
        working-directory: native-qnap-d1
        run: |
          files="internal/app/media_profile.go internal/app/media_profile_ffmpeg.go internal/app/scanner.go internal/app/rc315_chapter_markers_test.go internal/app/rc316_ffmpeg_profile_test.go internal/app/rc336_credits_marker_test.go"
          gofmt -d $files > ../qnap-gofmt.patch
          cat ../qnap-gofmt.patch

      - name: Capture native Go test output
        working-directory: native-qnap-d1
        run: |
          set +e
          go test ./... > ../qnap-go-test.log 2>&1
          code=$?
          cat ../qnap-go-test.log
          echo "$code" > ../qnap-go-test.exit
          exit 0

      - name: Upload QNAP diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: qnap-diagnostics
          path: |
            qnap-gofmt.patch
            qnap-go-test.log
            qnap-go-test.exit
          if-no-files-found: error
