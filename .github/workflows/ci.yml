name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests

      - name: Python compile check
        run: python -m compileall -q backend

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: TV JavaScript syntax check
        run: |
          node --check tv-app/js/app.js
          node --check tv-app/js/config.js
          node --check tv-app/js/browser-avplay-shim.js
          node --check tv-app/js/rc-release.js
          node --check tv-app/js/rc32-player-navigation.js
          node --check tv-app/js/rc37-enhancements.js
          node --check tv-app/js/rc38-search-surface.js
          node --check tv-app/js/rc39-cinematic-ui.js
          node --check tv-app/js/rc310-series-page.js
          node --check tools/player-state-smoke.js
          node --check tools/progress-consistency-smoke.js
          node --check tools/player-lifecycle-smoke.js
          node --check tools/player-exit-navigation-smoke.js
          node --check tools/root-back-exit-smoke.js
          node --check tools/rc311-series-back-smoke.js
          node --check tools/rc311-icon-smoke.js
          node --check tools/rc37-enhancements-smoke.js
          node --check tools/player-ux-rc37-smoke.js
          node --check tools/search-player-surface-smoke.js
          node --check tools/cinematic-ui-smoke.js
          node --check tools/rc310-series-page-smoke.js
          node --check tools/release-pipeline-smoke.js
          node --check tools/tizen4-compat-smoke.js
          node --check tools/release-candidate-smoke.js
          node --check tools/api-origin-smoke.js

      - name: TV player state smoke test
        run: node tools/player-state-smoke.js

      - name: TV progress consistency smoke test
        run: node tools/progress-consistency-smoke.js

      - name: TV AVPlay lifecycle smoke test
        run: node tools/player-lifecycle-smoke.js

      - name: TV player exit remote navigation gate
        run: node tools/player-exit-navigation-smoke.js

      - name: TV root Back exit gate
        run: node tools/root-back-exit-smoke.js

      - name: TV RC3.11 series Back regression gate
        run: node tools/rc311-series-back-smoke.js

      - name: TV RC3.11 Samsung icon gate
        run: node tools/rc311-icon-smoke.js

      - name: TV RC3.7 enhancement gate
        run: node tools/rc37-enhancements-smoke.js

      - name: TV RC3.7 player UX gate
        run: node tools/player-ux-rc37-smoke.js

      - name: TV search/player native-surface gate
        run: node tools/search-player-surface-smoke.js

      - name: TV RC3.9 cinematic UI gate
        run: node tools/cinematic-ui-smoke.js

      - name: TV RC3.10 compact home and series page gate
        run: node tools/rc310-series-page-smoke.js

      - name: RC3.7 release pipeline safety gate
        run: node tools/release-pipeline-smoke.js

      - name: Tizen 4 Chromium 56 compatibility gate
        run: node tools/tizen4-compat-smoke.js

      - name: TV release candidate UX and attribution gate
        run: node tools/release-candidate-smoke.js

      - name: TV API origin routing gate
        run: node tools/api-origin-smoke.js

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: native-qnap-d1/go.mod

      - name: QNAP D1 RC3.7 Go format gate
        working-directory: native-qnap-d1
        run: |
          files="internal/app/media_profile.go internal/app/image_cache.go internal/app/ux_api.go internal/app/rc37_test.go"
          test -z "$(gofmt -l $files)" || { echo 'gofmt required in RC3.7 modules:'; gofmt -l $files; exit 1; }

      - name: QNAP D1 native tests
        working-directory: native-qnap-d1
        run: go test ./...

      - name: Build QNAP D1 ARMv7 binary
        working-directory: native-qnap-d1
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -trimpath -ldflags="-s -w" -o ../qnap-d1-dist/homecinema-d1 ./cmd/homecinema-d1

      - name: Assemble QNAP D1 install bundle
        run: |
          cp qnap-d1/*.sh qnap-d1-dist/
          cp qnap-d1/README-QNAP-D1.md qnap-d1-dist/
          cp VERSION qnap-d1-dist/VERSION
          cp -R tv-app qnap-d1-dist/www
          chmod +x qnap-d1-dist/homecinema-d1 qnap-d1-dist/*.sh

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload QNAP D1 ARMv7 bundle
        uses: actions/upload-artifact@v5
        with:
          name: HomeCinema-D1-armv7-v${{ steps.version.outputs.value }}
          path: qnap-d1-dist/
          if-no-files-found: error
