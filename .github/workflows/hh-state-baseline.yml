name: HH State Baseline

on:
  push:
    paths:
      - ".github/workflows/hh-state-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest vacancy state
        uses: actions/cache/restore@v4
        with:
          path: hh-vacancy-agent/data
          key: ${{ runner.os }}-hh-vacancy-state-baseline-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hh-vacancy-state-

      - name: Mark current matching vacancies as seen without sending
        env:
          MIN_SCORE: "70"
          HH_PERIOD_DAYS: "3"
          STATE_PATH: hh-vacancy-agent/data/state.json
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("hh-vacancy-agent/monitor_rss.py")
          spec = importlib.util.spec_from_file_location("hh_monitor", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules["hh_monitor"] = module
          spec.loader.exec_module(module)

          state = module.load_state()
          matches, errors = module.collect()
          sent = state.setdefault("sent", {})
          stamp = module.now().isoformat()
          before = len(sent)
          for match in matches:
              sent[match.vacancy.vacancy_id] = stamp
          module.save_state(state)
          print({"matches": len(matches), "errors": len(errors), "sent_before": before, "sent_after": len(sent)})
          PY

      - name: Save repaired vacancy state
        uses: actions/cache/save@v4
        with:
          path: hh-vacancy-agent/data
          key: ${{ runner.os }}-hh-vacancy-state-baseline-${{ github.run_id }}
