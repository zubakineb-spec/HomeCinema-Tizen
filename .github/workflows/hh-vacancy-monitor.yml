name: HH Vacancy Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hh-vacancy-monitor.yml"
      - "hh-vacancy-agent/**"
  schedule:
    # Twice per hour; offset from :00 to reduce GitHub scheduler congestion.
    - cron: "8,38 * * * *"

permissions:
  contents: read

concurrency:
  group: hh-vacancy-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore vacancy state
        uses: actions/cache/restore@v4
        with:
          path: hh-vacancy-agent/data
          key: ${{ runner.os }}-hh-vacancy-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hh-vacancy-state-

      - name: Validate agent
        run: python -m py_compile hh-vacancy-agent/monitor_rss.py

      - name: Validate shared Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN secret is missing"; exit 2; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID secret is missing"; exit 2; }
          echo "Shared Telegram secrets are configured."

      - name: Search HH RSS and send new vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "70"
          MAX_PER_RUN: "10"
          HH_PERIOD_DAYS: "3"
          STATE_PATH: hh-vacancy-agent/data/state.json
        run: python hh-vacancy-agent/monitor_rss.py

      - name: Save vacancy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hh-vacancy-agent/data
          key: ${{ runner.os }}-hh-vacancy-state-${{ github.run_id }}
